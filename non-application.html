<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>

    <h1>Job Application Form</h1>

    <form action="#" method="post">

        <!-- Full Name -->
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" name="fullName"
               placeholder="Enter your full name" required>

        <br><br>

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>

        <br><br>

        <!-- Phone -->
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone"
               placeholder="Enter your phone number"
               pattern="[0-9]{10}"
               title="Enter a 10-digit phone number" required>

        <br><br>

        <!-- Date of Birth -->
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>

        <br><br>

        <!-- Portfolio URL -->
        <label for="portfolio">Portfolio URL:</label>
        <input type="url" id="portfolio" name="portfolio"
               placeholder="https://example.com">

        <br><br>

        <!-- Preferred Shift -->
        <p>Preferred Shift:</p>

        <input type="radio" id="morning" name="shift"
               value="Morning" required>
        <label for="morning">Morning</label>

        <input type="radio" id="evening" name="shift"
               value="Evening">
        <label for="evening">Evening</label>

        <input type="radio" id="night" name="shift"
               value="Night">
        <label for="night">Night</label>

        <br><br>

        <!-- Skills -->
        <p>Skills:</p>

        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label>

        <input type="checkbox" id="javascript"
               name="skills" value="JavaScript">
        <label for="javascript">JavaScript</label>

        <br><br>

        <!-- Qualification -->
        <label for="qualification">Highest Qualification:</label>
        <select id="qualification" name="qualification" required>
            <option value="">Select Qualification</option>
            <option value="12th">12th Pass</option>
            <option value="diploma">Diploma</option>
            <option value="graduate">Graduate</option>
            <option value="postgraduate">Postgraduate</option>
        </select>

        <br><br>

        <!-- Cover Letter -->
        <label for="coverLetter">Cover Letter:</label>
        <br>
        <textarea id="coverLetter" name="coverLetter"
                  rows="5" cols="40"
                  placeholder="Write your cover letter here"
                  required></textarea>

        <br><br>

        <!-- Disabled Field -->
        <label for="applicationStatus">Application Status:</label>
        <input type="text" id="applicationStatus"
               name="applicationStatus"
               value="Pending" disabled>

        <br><br>

        <!-- Submit Button -->
        <button type="submit">Submit Application</button>

    </form>

</body>
</html>
